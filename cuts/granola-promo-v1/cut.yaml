# Granola promo v2 (23.44 s). Written from PLAN.md / SCRIPT.md (lc-director), hook H2 from research/hooks.md,
# look from style.yaml (lc-art-director, verified from granola.ai). v1 is cut-v1.yaml.
# Coordinates are source pixels (640x360); shot times are seconds from the start of the shot.
name: granola-promo-v2
extends: style.yaml

sources:
  main: {path: "~/Downloads/Granola AI Tutorial for Beginners_206_291.mp4", enhance: 2}

audio:
  dialog: true
  sfx: true
  gain: 0.35
  open_hit: false
  end_hit: false                 # calm brand: no boom under the lockup (critic)
  cues:
    - {t: 0.05, sound: chime, gain: 0.15, why: "labelled poster frame"}
    - {t: 18.20, sound: key, gain: 0.25, why: "ideally by Tuesday appears in the line"}
    - {t: 18.26, sound: key, gain: 0.25, why: "ideally by Tuesday appears in the line"}
    - {t: 18.32, sound: key, gain: 0.25, why: "ideally by Tuesday appears in the line"}

subtitles:
  transcript: probe/Granola_AI_Tutorial_for_Beginners_206_291/transcript.json
  style: plate
  words: 5
  gap: 0.3
  mode: highlight
  size: 54
  y: 1030
  hold: 0.4
  active: text                   # calm: no word-by-word colour jumps (art director)
  fix: {granola: Granola}
  skip: [[83.60, 84.10]]                         # stray transcribed "is." (silent in the cut)

shots:
  - id: poster                                   # H2 result first: the finished note, labelled, is frame 0
    type: ui
    source: main
    duration: 1.92
    src: [[0, 53.00], [0.50, 53.00], [1.92, 54.42]]
    sound: mute
    subtitles: false
    camera: [{t: 0, frame: [83, 25, 595, 313], pad: 0}]
    labels:
      - {text: "What I wrote", anchor: [229, 107], side: right, at: -0.6, size: 64, fill: "#292929", color: "#f7f7f2", edge: "#292929"}
      - {text: "Granola generated", anchor: [406, 125], side: right, at: -0.6, size: 64, fill: "#eaebe5", color: "#292929", edge: "#eaebe5"}

  - id: builds                                   # "Instead of replacing my notes, it builds on them."
    type: ui
    source: main
    duration: 3.18
    src: {start: 54.42, speed: 1}
    enter: none
    camera: [{t: 0, frame: [83, 25, 595, 313], pad: 0}]
    labels:
      - {text: "What I wrote", anchor: [229, 107], side: right, at: -1, until: 2.88, size: 64, fill: "#292929", color: "#f7f7f2", edge: "#292929"}
      - {text: "Granola generated", anchor: [406, 125], side: right, at: -1, until: 2.88, size: 64, fill: "#eaebe5", color: "#292929", edge: "#eaebe5"}

  - id: context                                  # "If I want more context about something,"
    type: ui
    source: main
    enter: none                                  # critic: the dissolve ghosted two pages of text
    duration: 2.40
    src: {start: 67.20, speed: 1}
    camera: [{t: 0, frame: [24, 8, 616, 341], pad: 0}]
    rings: [{box: [145, 188, 476, 214], at: 0.92}]
    labels:
      - {text: "Granola generated", anchor: [300, 187], side: above, at: 1.32, size: 50, fill: "#eaebe5", color: "#292929", edge: "#eaebe5"}

  - id: magnifier                                # the one deliberate camera move; click on the magnifying glass
    type: ui
    source: main
    duration: 3.26
    src: {start: 70.60, speed: 1}
    sound: mute
    subtitles: false
    camera:
      - {t: 0, frame: [24, 8, 616, 341], pad: 0}
      - {t: 0.80, frame: [66, 58, 578, 346], pad: 0, ease: outExpo}
    rings: [{box: [494, 188, 506, 200], at: 1.05, until: 1.80, radius: 14}]
    caption: {text: "See where it *came from.*", in: 0.85, out: 3.20, size: 48}
    clicks: [1.70]
    busy: [[2.80, 3.26]]

  - id: summary                                  # "and here I could see a transcript summary of the relevant part of the conversation."
    type: ui
    source: main
    duration: 4.54
    src: {start: 73.86, speed: 1}
    enter: none
    camera: [{t: 0, frame: [66, 58, 578, 346], pad: 0}]
    rings: [{box: [200, 205, 508, 318], at: 1.28, radius: 12}]
    labels:
      - {text: "TRANSCRIPT SUMMARY", anchor: [258, 219], side: over, at: 1.72, size: 32, fill: "#ffffff", color: text, edge: "#ffffff"}   # crisp copy over the 360p header

  - id: yours                                    # "If I want to make any edits to these notes, here I could click in and type in my changes."
    type: ui
    source: main
    duration: 4.96                                  # critic pass 2: "changes." is voiced to 83.76, its "z" to 83.90
    src: {start: 79.00, speed: 1}
    camera: [{t: 0, frame: [66, 58, 578, 346], pad: 0}]
    rings: [{box: [153, 141, 380, 157], at: 1.14}]
    labels:
      - {text: "What I wrote", anchor: [323, 157], side: below, at: 3.20, size: 50, fill: "#292929", color: "#f7f7f2", edge: "#292929"}   # the edited line is yours again
      - {text: "Footage and voice: Kevin Stratvert, Granola-sponsored tutorial", anchor: [322, 66], side: over, at: 0.3, size: 40, fill: bg, color: muted, edge: bg}
    clicks: [1.90]

  - id: end
    type: end
    duration: 3.40
    enter: none                                  # cut to paper, logo fades in
    glow: 0
    lockup: {image: brand/logos/Granola_lockup_black_lg.png, width: 600, y: 380}
    command: {text: "granola.ai", prefix: "", at: 1.05, cps: 20}
    tagline: {text: "The AI notepad for back-to-back meetings", at: 0.55, size: 56, font: serif, color: text}
